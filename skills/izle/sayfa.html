<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Polycrew Team Watch</title>
<style>
/* Layout: counters on top, then running now, timeline, quotas, job table; a side panel on click. Two languages (METIN). */
:root {
  --bg: #f6f5f1; --surface: #ffffff; --ink: #1d1d1f; --muted: #66666e; --line: #dedcd5;
  --claude: #c8643f; --codex: #0f8f6f; --gemini: #3a6fd8; --hata: #c0392b; --ok: #2e7d4f;
  --track: #ecebe6; --focus: #b97d06;
  --mono: ui-monospace, "JetBrains Mono", Menlo, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141519; --surface: #1c1d23; --ink: #e8e8ec; --muted: #9a9aa6; --line: #2e2f38;
    --claude: #e08a66; --codex: #3cc39c; --gemini: #7ea4f0; --hata: #ef7d6e; --ok: #6cc48a;
    --track: #24252d; --focus: #f0b93a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141519; --surface: #1c1d23; --ink: #e8e8ec; --muted: #9a9aa6; --line: #2e2f38;
  --claude: #e08a66; --codex: #3cc39c; --gemini: #7ea4f0; --hata: #ef7d6e; --ok: #6cc48a;
  --track: #24252d; --focus: #f0b93a; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--sans); }
.wrap { max-width: 72rem; margin: 0 auto; padding: 20px 16px 48px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; }
.wrap > *, .row > *, section { min-width: 0; }
h1 { font-size: 1.5rem; margin: 0; }
h2 { font-size: 1rem; margin: 0 0 10px; color: var(--muted); font-weight: 600; letter-spacing: .02em; }
header { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline; }
.meta { color: var(--muted); font: 12px var(--mono); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); color: var(--ink); padding: 5px 10px; font: inherit; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
button:focus-visible, .row:focus-visible, .card:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.sayac { display: flex; gap: 16px; flex-wrap: wrap; }
.sayac div { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; min-width: 7rem; }
.sayac b { display: block; font-size: 1.4rem; }
.sayac span { color: var(--muted); font-size: 12px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 17rem), 1fr)); gap: 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--c); border-radius: 8px; padding: 10px 12px; cursor: pointer; min-width: 0; }
.card .ust { display: flex; justify-content: space-between; gap: 8px; font: 12px var(--mono); color: var(--muted); }
.card .ad { font-weight: 600; margin: 2px 0; overflow-wrap: anywhere; }
.card .ac { color: var(--muted); overflow-wrap: anywhere; }
.bos { color: var(--muted); font-style: italic; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--c); margin-right: 6px; vertical-align: 1px; }
.p-claude { --c: var(--claude); } .p-codex { --c: var(--codex); } .p-gemini { --c: var(--gemini); }
.cizelge { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; overflow: hidden; }
.eksen { position: relative; height: 18px; margin-left: var(--lw); font: 11px var(--mono); color: var(--muted); }
.eksen span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.row { display: grid; grid-template-columns: var(--lw) 1fr; align-items: center; gap: 8px; padding: 3px 0; cursor: pointer; border-radius: 4px; }
.row:hover { background: var(--track); }
.row .et { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.track { position: relative; height: 14px; background: var(--track); border-radius: 3px; }
.bar { position: absolute; top: 0; height: 100%; border-radius: 3px; background: var(--c); min-width: 3px; }
.bar.calisiyor { background-image: repeating-linear-gradient(45deg, transparent 0 6px, rgba(255,255,255,.35) 6px 12px); animation: kay 1s linear infinite; background-size: 17px 17px; }
.bar.hata { background: var(--hata); }
.bar.bilinmiyor { opacity: .4; }
@keyframes kay { to { background-position: 17px 0; } }
@media (prefers-reduced-motion: reduce) { .bar.calisiyor { animation: none; } }
:root { --lw: 16rem; }
@media (max-width: 640px) { :root { --lw: 0px; } .row { grid-template-columns: 1fr; gap: 2px; } .eksen { margin-left: 0; } }
.kota { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 15rem), 1fr)); gap: 10px; }
.kova { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
.kova .b { display: flex; justify-content: space-between; font-size: 12px; }
.kova .pen { margin-top: 8px; color: var(--muted, inherit); }
.olcu { height: 8px; background: var(--track); border-radius: 4px; overflow: hidden; margin-top: 6px; }
.olcu i { display: block; height: 100%; background: var(--c); }
.olcu i.yuksek { background: var(--hata); }
.olcu i.eski { opacity: .25; }
.eski-etiket { color: var(--muted); font-weight: 400; font-size: 11px; }
.baglam { border-top: 1px solid var(--line); margin-top: 10px; padding-top: 3px; }
.baglam .olcu { height: 3px; }
.kova .b { gap: 8px; flex-wrap: wrap; overflow-wrap: anywhere; }
.harita { display: grid; gap: 6px; min-width: 0; }
.dugum { margin-left: calc(var(--derinlik) * clamp(8px, 2vw, 20px)); }
.dugum .ust { flex-wrap: wrap; }
.dugum .ad { font-size: 13px; }
.dugum .ac { font-size: 12px; }
.dugum.ozet { background: var(--track); }
.tbl { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 600; white-space: nowrap; }
td.n { font-family: var(--mono); white-space: nowrap; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--track); }
.dur-bitti { color: var(--ok); } .dur-hata { color: var(--hata); } .dur-calisiyor { color: var(--focus); } .dur-bilinmiyor { color: var(--muted); }
aside { position: fixed; inset: 0 0 0 auto; width: min(100%, 44rem); background: var(--surface); border-left: 1px solid var(--line); box-shadow: -8px 0 24px rgba(0,0,0,.15); display: none; flex-direction: column; z-index: 5; }
aside.acik { display: flex; }
aside header { padding: 12px 16px; border-bottom: 1px solid var(--line); justify-content: space-between; }
aside .govde { padding: 12px 16px; overflow: auto; }
aside pre { white-space: pre-wrap; overflow-wrap: anywhere; font: 12.5px/1.55 var(--mono); margin: 0; }
.kapat { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 data-t="baslik"></h1>
    <span class="meta" id="guncel"></span>
    <div class="seg" id="pencere" role="group">
      <button type="button" data-saat="3" data-t="s3"></button>
      <button type="button" data-saat="12" data-t="s12" aria-pressed="true"></button>
      <button type="button" data-saat="48" data-t="s48"></button>
      <button type="button" data-saat="0" data-t="hepsi"></button>
    </div>
    <div class="seg" id="dil" role="group" aria-label="Language / Dil">
      <button type="button" data-dil="en">EN</button><button type="button" data-dil="tr">TR</button>
    </div>
  </header>
  <div class="sayac" id="sayac"></div>
  <section><h2 data-t="simdi"></h2><div class="cards" id="simdi"></div></section>
  <section><h2 data-t="cizelge"></h2><div class="cizelge"><div class="eksen" id="eksen"></div><div id="satirlar"></div></div></section>
  <section><h2 data-t="harita"></h2><div class="harita" id="harita"></div><p class="meta" data-t="pmNot"></p></section>
  <section><h2 data-t="kota"></h2><div class="kota" id="kota"></div><p class="meta" id="kota-not"></p></section>
  <section><h2 data-t="isler"></h2><div class="tbl"><table>
    <thead><tr><th data-t="tBasladi"></th><th data-t="tKim"></th><th data-t="tIs"></th><th data-t="tSure"></th><th data-t="tToken"></th><th data-t="tDurum"></th><th data-t="tPuan"></th></tr></thead>
    <tbody id="tablo"></tbody></table></div></section>
</div>
<aside id="panel">
  <header><div><b id="p-baslik"></b><div class="meta" id="p-alt"></div></div>
    <div><span class="seg"><button type="button" id="p-rapor" aria-pressed="true" data-t="rapor"></button><button type="button" id="p-gorev" data-t="gorev"></button></span>
    <button type="button" class="kapat" id="p-kapat" data-t="kapat"></button></div></header>
  <div class="govde"><pre id="p-metin"></pre></div>
</aside>
<script>
const GOMULU = /*VERI*/null;
const METIN = {
  en: {
    baslik: "Team watch", s3: "3 h", s12: "12 h", s48: "2 days", hepsi: "All",
    simdi: "Running now", cizelge: "Timeline", kota: "Quotas", isler: "Jobs and scores",
    tBasladi: "Started", tKim: "Who", tIs: "Task", tSure: "Duration", tToken: "Tokens", tDurum: "Status", tPuan: "Score",
    rapor: "Report", gorev: "Task", kapat: "Close", pencere: "Time window", panel: "Job details",
    guncellendi: "updated", raporBasligi: "report", calisiyor: "running", bitti: "done", hata: "failed", bilinmiyor: "unknown",
    toplamIs: "jobs", toplamSure: "total time", bosSimdi: "No agent or external worker is running right now.",
    bosPencere: "No jobs in this window.", bosKota: "No quota reading yet (dis-ajan.sh kota).", yenilenir: "resets", p5: "5 hours", pHafta: "week",
    olcum: "measured", claudeNot: "Claude: no reading (PM records it)", eski: "stale reading", baglam: "context",
    harita: "Agent map", pm: "PM · main session", baslatan: "started by",
    pmNot: "PM shows a summary of the selected jobs; its model is not logged.",
    yukleniyor: "loading…", okunamadi: "could not be read", yok: "(none)", henuzRapor: "(no report yet)",
    raporYok: "(no report found)", sunucuYok: "cannot reach the server",
    sn: "s", dk: "min", sa: "h", yerel: "en-GB", okur: "read-only", yazar: "writer",
  },
  tr: {
    baslik: "Takım izleme", s3: "3 sa", s12: "12 sa", s48: "2 gün", hepsi: "Hepsi",
    simdi: "Şimdi çalışanlar", cizelge: "Zaman çizelgesi", kota: "Kota", isler: "İşler ve puanlar",
    tBasladi: "Başladı", tKim: "Kim", tIs: "İş", tSure: "Süre", tToken: "Token", tDurum: "Durum", tPuan: "Puan",
    rapor: "Rapor", gorev: "Görev", kapat: "Kapat", pencere: "Zaman penceresi", panel: "İş ayrıntısı",
    guncellendi: "güncellendi", raporBasligi: "rapor", calisiyor: "çalışıyor", bitti: "bitti", hata: "hata", bilinmiyor: "bilinmiyor",
    toplamIs: "toplam iş", toplamSure: "toplam süre", bosSimdi: "Şu anda çalışan agent ya da dış işçi yok.",
    bosPencere: "Bu pencerede iş yok.", bosKota: "Kota ölçümü yok (dis-ajan.sh kota).", yenilenir: "yenilenir", p5: "5 saat", pHafta: "hafta",
    olcum: "ölçüm", claudeNot: "Claude: ölçüm yok (PM yazar)", eski: "eski ölçüm", baglam: "bağlam",
    harita: "Agent haritası", pm: "PM · ana oturum", baslatan: "başlatan",
    pmNot: "PM seçili işlerin özetini gösterir; kendi modeli günlüğe yazılmıyor.",
    yukleniyor: "yükleniyor…", okunamadi: "okunamadı", yok: "(yok)", henuzRapor: "(henüz rapor yok)",
    raporYok: "(rapor bulunamadı)", sunucuYok: "sunucuya ulaşılamıyor",
    sn: "sn", dk: "dk", sa: "sa", yerel: "tr-TR", okur: "okur", yazar: "yazar",
  },
};
function ilkDil() {
  const q = new URLSearchParams(location.search).get("lang");
  if (q && METIN[q]) return q;
  if (GOMULU && GOMULU.dil && METIN[GOMULU.dil]) return GOMULU.dil;
  try { const s = localStorage.getItem("polycrew-dil"); if (s && METIN[s]) return s; } catch {}
  return (navigator.language || "en").toLowerCase().startsWith("tr") ? "tr" : "en";
}
let dil = ilkDil();
const t = (k) => METIN[dil][k] ?? METIN.en[k] ?? k;
let saat = 12, veri = null, secili = null, sekme = "rapor", sonKota = 0;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const saatStr = (ts) => new Date(ts * 1000).toLocaleTimeString(t("yerel"), { hour: "2-digit", minute: "2-digit" });
const gunStr = (ts) => new Date(ts * 1000).toLocaleString(t("yerel"), { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
function sure(s) {
  if (s == null) return "—";
  s = Math.round(s);
  if (s < 60) return `${s} ${t("sn")}`;
  const d = Math.floor(s / 60);
  return d < 60 ? `${d} ${t("dk")} ${s % 60} ${t("sn")}` : `${Math.floor(d / 60)} ${t("sa")} ${d % 60} ${t("dk")}`;
}
const saglayiciAd = { claude: "Claude", codex: "Codex", gemini: "Gemini" };
function kim(i) {
  if (i.kaynak === "claude") return (i.rol || "agent") + (i.model ? " · " + i.model : "");
  return (i.model || i.kaynak) + (i.efor && i.efor !== "-" ? " " + i.efor : "") + (i.rol ? " · " + t(i.rol) : "");
}
function token(n) { return n == null ? "—" : n >= 1e6 ? (n / 1e6).toFixed(2) + "M" : n >= 1e3 ? Math.round(n / 1e3) + "k" : String(n); }

function sabitler() {
  document.documentElement.lang = dil;
  document.title = "Polycrew " + t("baslik");
  for (const el of document.querySelectorAll("[data-t]")) el.textContent = t(el.dataset.t);
  $("pencere").setAttribute("aria-label", t("pencere"));
  $("panel").setAttribute("aria-label", t("panel"));
  for (const b of $("dil").children) b.setAttribute("aria-pressed", b.dataset.dil === dil);
}

function ciz() {
  if (!veri) return;
  const isler = veri.isler;
  const simdi = veri.simdi;
  $("guncel").textContent = GOMULU ? `${t("raporBasligi")} · ${gunStr(simdi)}` : `${t("guncellendi")} ${saatStr(simdi)}`;
  const say = (d) => isler.filter((i) => i.durum === d).length;
  $("sayac").innerHTML = [[t("calisiyor"), say("calisiyor")], [t("bitti"), say("bitti")], [t("hata"), say("hata")],
    [t("toplamIs"), isler.length], [t("toplamSure"), sure(isler.reduce((a, i) => a + (i.sure || 0), 0))]]
    .map(([a, b]) => `<div><b>${b}</b><span>${a}</span></div>`).join("");

  const calisan = isler.filter((i) => i.durum === "calisiyor");
  $("simdi").innerHTML = calisan.length ? calisan.map((i) => `
    <div class="card p-${i.saglayici}" tabindex="0" data-id="${esc(i.id)}">
      <div class="ust"><span><span class="dot"></span>${saglayiciAd[i.saglayici]}</span><span>${sure(i.sure)}</span></div>
      <div class="ad">${esc(kim(i))}</div><div class="ac">${esc(i.aciklama || "")}</div></div>`).join("")
    : `<div class="bos">${t("bosSimdi")}</div>`;

  const bas = Math.min(...isler.map((i) => i.baslangic ?? i.bitis ?? simdi), simdi - 600);
  const bit = GOMULU ? Math.max(...isler.map((i) => i.bitis ?? i.baslangic ?? 0), bas + 60) : simdi;
  const genis = Math.max(bit - bas, 60);
  const yuzde = (x) => ((x - bas) / genis) * 100;
  const adim = [300, 600, 900, 1800, 3600, 7200, 14400, 28800].find((a) => genis / a <= 8) || 86400;
  let eksen = "";
  for (let x = Math.ceil(bas / adim) * adim; x <= bit; x += adim) eksen += `<span style="left:${yuzde(x)}%">${saatStr(x)}</span>`;
  $("eksen").innerHTML = eksen;
  $("satirlar").innerHTML = isler.length ? isler.map((i) => {
    const b = i.baslangic ?? i.bitis, e = i.bitis ?? (i.durum === "calisiyor" ? simdi : b);
    return `<div class="row p-${i.saglayici}" tabindex="0" data-id="${esc(i.id)}" title="${esc(kim(i) + " — " + (i.aciklama || ""))}">
      <div class="et"><span class="dot"></span>${esc(kim(i))} <span class="meta">${esc(i.aciklama || "")}</span></div>
      <div class="track"><div class="bar ${i.durum}" style="left:${yuzde(b)}%;width:${Math.max(yuzde(e) - yuzde(b), 0.3)}%"></div></div></div>`;
  }).join("") : `<div class="bos">${t("bosPencere")}</div>`;

  const dugumler = [];
  function agac(n, derinlik = 0, ust = null) {
    if (!n) return;
    dugumler.push(`<div class="card dugum p-${n.saglayici}${n.sanal ? " ozet" : ""}" tabindex="0" role="button"
      style="--derinlik:${Math.min(derinlik, 3)}" data-id="${esc(n.id)}">
      <div class="ust"><span><span class="dot"></span>${esc(saglayiciAd[n.saglayici])}</span>
      <span class="dur-${n.durum}">${t(n.durum)} · ${sure(n.sure)}${n.puan ? ` · ${esc(n.puan.not)}/5` : ""}</span></div>
      <div class="ad">${n.sanal ? t("pm") : esc(n.rol ? t(n.rol) : n.aciklama || "agent")} · ${esc(n.model || "—")}</div>
      <div class="ac">${ust ? `${t("baslatan")}: ${ust.sanal ? "PM" : esc(ust.rol || ust.id)} · ` : ""}${esc(n.aciklama || "")}</div></div>`);
    for (const cocuk of n.cocuklar || []) agac(cocuk, derinlik + 1, n);
  }
  agac(veri.harita);
  $("harita").innerHTML = dugumler.join("") || `<div class="bos">${t("bosPencere")}</div>`;

  const kovalar = (veri.kota && veri.kota.kovalar) || [];
  // One card per provider group; its 5-hour and weekly windows are rows of the same card.
  const gruplar = new Map();
  for (const k of kovalar) {
    const ad = `${k.saglayici}|${k.grup}`;
    if (!gruplar.has(ad)) gruplar.set(ad, { k, satirlar: [] });
    gruplar.get(ad).satirlar.push(k);
  }
  const pencere = (ad) => /^(5h|5 saat)$/i.test(ad) ? "p5" : /^(weekly|week|hafta)$/i.test(ad) ? "pHafta" : null;
  const sira = { p5: 0, pHafta: 1 };
  const kartlar = [...gruplar.values()].sort((a, b) => Number(b.k.saglayici === "claude") - Number(a.k.saglayici === "claude"));
  $("kota").innerHTML = kovalar.length ? kartlar.map(({ k, satirlar }) => {
    const p = k.saglayici === "codex" ? "codex" : k.saglayici === "claude" || /claude|gpt/i.test(k.grup) ? "claude" : "gemini";
    satirlar.sort((a, b) => (sira[pencere(a.pencere)] ?? 9) - (sira[pencere(b.pencere)] ?? 9));
    return `<div class="kova p-${p}"><div class="b"><span><span class="dot"></span>${esc(k.grup)}</span>${k.plan ? `<span class="meta">${esc(k.plan)}</span>` : ""}</div>` + satirlar.map((r) => {
      const u = Math.max(0, Math.min(100, Number(r.kullanilan) || 0));
      const ad = pencere(r.pencere);
      const baglam = r.pencere === "bağlam";
      return `<div class="${baglam ? "baglam" : ""}"><div class="b pen"><span>${esc(baglam ? t("baglam") : ad ? t(ad) : r.pencere)}${r.eski ? ` · <span class="eski-etiket">${t("eski")}</span>` : ""}</span><b>${Math.round(u)}%${r.token != null ? ` · ${token(r.token)}` : ""}</b></div>
      <div class="olcu"><i class="${u >= 60 ? "yuksek" : ""} ${r.eski ? "eski" : ""}" style="width:${u}%"></i></div>
      <div class="meta">${r.yenilenir ? `${t("yenilenir")} ${esc(String(r.yenilenir).replace("T", " "))} · ` : ""}${t("olcum")} ${gunStr(r.olcum_ts)}</div></div>`;
    }).join("") + `</div>`;
  }).join("") : `<div class="bos">${t("bosKota")}</div>`;
  $("kota-not").textContent = kovalar.some((k) => k.saglayici === "claude") ? "" : t("claudeNot");

  $("tablo").innerHTML = isler.slice().reverse().map((i) => `
    <tr data-id="${esc(i.id)}"><td class="n">${i.baslangic != null ? gunStr(i.baslangic) : "—"}</td>
      <td><span class="p-${i.saglayici}"><span class="dot"></span></span>${esc(kim(i))}</td><td>${esc(i.aciklama || "")}</td>
      <td class="n">${sure(i.sure)}</td><td class="n">${token(i.token)}</td>
      <td class="dur-${i.durum}">${t(i.durum)}</td>
      <td>${i.puan ? `<b>${esc(i.puan.not)}/5</b> <span class="meta">${esc(i.puan.gerekce || "")}</span>` : "—"}</td></tr>`).join("");
  if (secili) panelBaslik();
}

function panelBaslik() {
  const i = secili;
  $("p-baslik").textContent = kim(i);
  $("p-alt").textContent = `${saglayiciAd[i.saglayici]} · ${t(i.durum)} · ${sure(i.sure)}${i.klasor ? " · " + i.klasor : ""}`;
}
async function ac(id) {
  const i = veri.isler.find((x) => x.id === id) || (veri.harita?.id === id ? veri.harita : null);
  if (!i) return;
  secili = i;
  panelBaslik();
  $("panel").classList.add("acik");
  if (i.sanal) { i._metin = { rapor: t("pmNot") + "\n\n" + veri.isler.map((x) => `${kim(x)} · ${t(x.durum)} · ${sure(x.sure)}`).join("\n"), gorev: t("pmNot") }; }
  else if (GOMULU) { i._metin = { rapor: i._rapor, gorev: i._gorev }; }
  else {
    $("p-metin").textContent = t("yukleniyor");
    try { i._metin = await (await fetch("api/is?id=" + encodeURIComponent(id))).json(); } catch { i._metin = { rapor: t("okunamadi"), gorev: "" }; }
  }
  goster();
}
function goster() {
  $("p-rapor").setAttribute("aria-pressed", sekme === "rapor");
  $("p-gorev").setAttribute("aria-pressed", sekme === "gorev");
  const m = secili && secili._metin && secili._metin[sekme];
  const bos = sekme === "rapor" ? (secili && secili.durum === "calisiyor" ? t("henuzRapor") : t("raporYok")) : t("yok");
  $("p-metin").textContent = m || bos;
}
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-id]");
  if (el && !e.target.closest("aside")) ac(el.dataset.id);
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { $("panel").classList.remove("acik"); secili = null; }
  if (["Enter", " "].includes(e.key) && e.target.dataset && e.target.dataset.id) { e.preventDefault(); ac(e.target.dataset.id); }
});
$("p-kapat").onclick = () => { $("panel").classList.remove("acik"); secili = null; };
$("p-rapor").onclick = () => { sekme = "rapor"; goster(); };
$("p-gorev").onclick = () => { sekme = "gorev"; goster(); };
$("pencere").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  saat = Number(b.dataset.saat);
  for (const x of $("pencere").children) x.setAttribute("aria-pressed", x === b);
  try { localStorage.setItem("polycrew-saat", saat); } catch {}
  GOMULU ? ciz() : yenile();
});
$("dil").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  dil = b.dataset.dil;
  try { localStorage.setItem("polycrew-dil", dil); } catch {}
  sabitler(); ciz(); if (secili) goster();
});

async function yenile() {
  const kota = Date.now() - sonKota > 60000 ? 1 : 0;
  if (kota) sonKota = Date.now();
  try {
    veri = await (await fetch(`api/durum?saat=${saat}&kota=${kota}`)).json();
    ciz();
  } catch { $("guncel").textContent = t("sunucuYok"); }
}
sabitler();
if (GOMULU) {
  veri = GOMULU;
  $("pencere").hidden = true;
  ciz();
} else {
  try { const s = localStorage.getItem("polycrew-saat"); if (s !== null) { saat = Number(s); for (const x of $("pencere").children) x.setAttribute("aria-pressed", Number(x.dataset.saat) === saat); } } catch {}
  yenile();
  setInterval(yenile, 3000);
}
</script>
</body>
</html>
